[project]
name = "casetrace-api"
version = "0.1.0"
description = "CASETRACE synthetic clinical investigation API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "aiosqlite>=0.21,<1",
  "alembic>=1.15,<2",
  "openai>=2,<3",
]

[dependency-groups]
case-data = [
    "pillow>=13.0.0",
    "pymupdf>=1.26,<2",
    "reportlab>=5.0.1",
]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
